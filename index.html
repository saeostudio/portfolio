<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stefan Land | Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Fixed Header -->
    <header>
        <div class="site-logo">
            <a href="index.html">
                <img src="images/logo.png" alt="Stefan Land" class="logo-img">
            </a>
        </div>
        <div class="menu-toggle" id="menuToggle">[ Menu ]</div>
    </header>

    <!-- Navigation Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-close" id="menuClose">[ Close ]</div>
        <div class="menu-links">
            <a href="commissioned.html" class="menu-link" data-img="https://placehold.co/600x400?text=Comm">Commissioned</a>
            <a href="personal.html" class="menu-link" data-img="https://placehold.co/600x400?text=Pers">Personal</a>
            <a href="portraits.html" class="menu-link" data-img="https://placehold.co/600x400?text=Port">Portraits</a>
            <a href="travel.html" class="menu-link" data-img="https://placehold.co/600x400?text=Trav">Travel</a>
            <a href="analogue.html" class="menu-link" data-img="https://placehold.co/600x400?text=Film">Analogue</a>
            <a href="about.html" class="menu-link" style="-webkit-text-stroke: 0; color: black; font-size: 2rem; margin-top: 40px;">About</a>
        </div>
    </div>

    <!-- Homepage: Draggable Desk -->
    <main class="desk-container" id="deskContainer">
        <!-- Category Items -->

        <!-- Commissioned -->
        <div class="draggable-item" data-link="commissioned.html" style="top: 20%; left: 25%; transform: rotate(-5deg);">
            <img src="https://placehold.co/600x450/e0e0e0/ffffff?text=Commissioned" alt="Commissioned">
            <div class="item-label">Commissioned</div>
        </div>

        <!-- Personal -->
        <div class="draggable-item" data-link="personal.html" style="top: 50%; left: 60%; transform: rotate(8deg); z-index: 2;">
            <img src="https://placehold.co/500x600/d0d0d0/ffffff?text=Personal" alt="Personal">
            <div class="item-label">Personal Projects</div>
        </div>

        <!-- Portraits -->
        <div class="draggable-item" data-link="portraits.html" style="top: 15%; left: 65%; transform: rotate(-3deg);">
            <img src="https://placehold.co/500x500/f0f0f0/ffffff?text=Portraits" alt="Portraits">
            <div class="item-label">Portraits</div>
        </div>

        <!-- Travel -->
        <div class="draggable-item" data-link="travel.html" style="top: 60%; left: 15%; transform: rotate(-10deg);">
            <img src="https://placehold.co/600x400/eeeeee/ffffff?text=Travel" alt="Travel">
            <div class="item-label">Travel Diaries</div>
        </div>

        <!-- Analogue -->
        <div class="draggable-item" data-link="analogue.html" style="top: 35%; left: 45%; transform: rotate(5deg);">
            <img src="https://placehold.co/400x400/cccccc/ffffff?text=Analogue" alt="Analogue">
            <div class="item-label">Analogue Archive</div>
        </div>

        <!-- Instructions (Bottom Right) -->
        <div style="position: absolute; bottom: 40px; right: 40px; font-family: 'Courier New', monospace; font-size: 12px; opacity: 0.5; pointer-events: none; text-align: right;">
            ( drag to organize )<br>
            ( click to explore )
        </div>

        <!-- Quick Access (Bottom Left) -->
        <div style="position: absolute; bottom: 40px; left: 40px; font-family: 'Courier New', monospace; font-size: 14px;">
            <a href="about.html" style="text-decoration: underline;">[ About ]</a>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
